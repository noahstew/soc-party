version: '2'
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/platform
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
  - engine: postgresql
    schema: game_migrations
    queries: queries/game
    gen:
      go:
        package: gamestore
        out: internal/gamestore
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
